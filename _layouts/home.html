---
layout: default
bodyClass: "page-home"
---

<div class="home-container">
  <div class="post">
    <header class="post-header">
      <h1 class="post-title">{{ page.title }}</h1>
      {% if page.subtitle %}<p class="post-desc">{{ page.subtitle }}</p>{% endif %}
    </header>
    <article>
      <div class="profile">
        <figure>
          <img src="{{ '/images/team/FCY.jpg' | relative_url }}" class="img-fluid rounded" alt="{{ page.title }}" width="220" height="auto" />
        </figure>
      </div>
      <div class="clearfix">
        {{ content }}
      </div>
    </article>
  </div>
</div>
