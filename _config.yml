baseurl: '/'
permalink: pretty
title: 'FancyAI Lab'

description: 'Academic group website built with Jekyll Serif.'

logo:
  mobile: "images/logo/1.png"
  mobile_height: "38px"
  mobile_width: "38px"
  desktop: "images/logo/1.png"
  desktop_height: "48px"
  desktop_width: "160px"
  favicon: "images/logo/2.png"

collections:
  topics:
    output: true
    sort_by: weight

defaults:
  - scope:
      path: ""
      type: "topics"
    values:
      layout: "topic"

sass:
  style: compressed # possible values: nested expanded compact compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - LICENSE.md
  - LICENSE
  - README.md
  - OLD/
  - OK/

# ---------------------------------------------------------------------------
# 访问统计（Analytics）
#
# 填入哪个服务的 ID，站点就启用哪个；留空的服务完全不输出代码、不发请求。
# 可以同时启用多个（例如 GoatCounter + GA4 交叉验证）。
#
# 费用说明（2026-10 核实官方页面）：下列五种对「个人学术主页」这类非商业站点
# 均为免费，无需付费、无需绑卡。
#   · GoatCounter 官方定价页明确写着「免费供合理公开使用，个人站与中小站点适用」；
#     第三方评测站提到的付费档只针对商业用途/高流量站点，非商业站不受影响。
#   · Cloudflare Web Analytics 包含在所有 Cloudflare 套餐（含免费版）中，无流量分档。
#
# 1) GoatCounter  —— 推荐。免费、无 Cookie、无需同意弹窗、脚本约 3.5KB，
#                    后台含「每日访问曲线 + 国家/地区分布 + 来源 + 浏览器」。
#    注册： https://www.goatcounter.com/signup
#    注册时填的子域名即 goatcounter_code，例如子域名是 fancyailab，
#    则后台地址为 https://fancyailab.goatcounter.com
#
# 2) Umami Cloud —— 有免费额度（个人站足够），界面现代，含国家地图与实时访客。
#    注册： https://cloud.umami.is  → 添加网站 → 复制 script 的 src 与 data-website-id
#
# 3) Microsoft Clarity —— 完全免费、无流量上限、无需绑卡，对任意域名都能直接用；
#                         含国家/每日统计，另附热图与会话录屏。
#    注册： https://clarity.microsoft.com  → 新建项目 → 项目 ID
#
# 4) Google Analytics 4 —— 免费，维度最全（国家/城市/设备/来源/留存）。
#    注意：使用 Cookie，若面向欧洲访客宜补一条同意提示。
#    注册： https://analytics.google.com  → 数据流中的衡量 ID，形如 G-XXXXXXXXXX
#
# 5) Cloudflare Web Analytics —— 免费、无 Cookie，含国家与来源（另附 Core Web Vitals）。
#    注意：本站是 GitHub Pages 的 *.github.io 域名，无法接入 Cloudflare 代理；
#    只能走「非代理站点」的 JS snippet 方式。若注册 hostname 时被拒，改用上面几种。
#    注册： https://dash.cloudflare.com → Web Analytics → Add a site（选 JS snippet 方式）
#    → Manage site 复制 token
# ---------------------------------------------------------------------------
analytics:
  goatcounter_code: "hahajiang"   # GoatCounter 账号子域名 → 后台 https://hahajiang.goatcounter.com
  umami_src: ""             # 例：https://cloud.umami.is/script.js
  umami_website_id: ""      # 例：xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
  ga4_measurement_id: ""    # 例：G-XXXXXXXXXX
  cloudflare_token: ""      # 例：a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
  clarity_project_id: ""    # 例：abcdefghij
